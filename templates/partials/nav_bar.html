<script>
    setInterval(function() {
        $.ajax({
            url: "{% url 'request_notifications' %}",
            success: function(responseData){
                var total_notifications = responseData.unread_notifications
                if(total_notifications){
                    document.getElementById('notifications-icon').style.display = "block"
                    document.getElementById('notifications-counter').innerHTML = total_notifications
                }else{
                    document.getElementById('notifications-icon').style.display = "none"
                }
            }
        })
        tellTime().catch(console.log);
    }, 3600000);
</script>
