<!-- JS -->
<script src="{% static '' %}jquery.min.js"></script>
<script>
    $(document).ready(function() {

        preloadVatCodeElement()

        $('#addProductModal').on('hidden.bs.modal', function (){
           productsInitialLoad()
        })




        $('#stockDetailsModal').on('show.bs.modal', function (event) {
            if ($(event.relatedTarget).is('a')){
                var product_id = $(event.relatedTarget).data('object-id')

                $.ajax({
                    url: "{% url 'get_product_details' %}", 
                    data:{
                        product_id: product_id
                    }, 
                    success:function(responseData) {
                        if(responseData.custome_status == "Error"){ 
                            swal({
                                title: "Error",
                                text: responseData.message,
                                type: "error"
                            });
                        }else{
                            document.getElementById('product-details-title-value').innerHTML = responseData.details['title']
                            document.getElementById('product-details-details-value').innerHTML = responseData.details['details']
                            document.getElementById('product-details-product-code-value').innerHTML = responseData.details['product_code']
                            document.getElementById('product-details-vat-code-value').innerHTML = responseData.details['vat_code_text']
                            document.getElementById('product-details-status-value').innerHTML = responseData.details['status']
                        }
                    },
                    error: function(responseData, error){
                        swal({
                            title: "Error",
                            text: "An error ocured! " + error,
                            type: "error"
                        });
                    },
                    complete: function(){
                    }
                });
            }

        
        })


        $('#updateProductModal').on('show.bs.modal', function (event) {
            if ($(event.relatedTarget).is('a')){
                var product_id = $(event.relatedTarget).data('object-id')
                sessionStorage.setItem('product_id_for_update', product_id)

                $.ajax({
                    url: "{% url 'get_product_details' %}", 
                    data:{ product_id: product_id }, 
                    success:function(responseData) {
                        if(responseData.custome_status == "Error"){ 
                            swal({
                                title: "Error",
                                text: responseData.message,
                                type: "error"
                            });
                        }else{
                            document.getElementById('update-product-title-value').value = responseData.details['title']
                            document.getElementById('update-product-details-value').value = responseData.details['details']
                            document.getElementById('update-product-product-code-value').value = responseData.details['product_code']
                            document.getElementById('update-product-status-value').value = responseData.details['status']

                            var selectElement = document.getElementById('update-product-vat-code-value')
                            $("#update-product-vat-code-value").empty();

                            var newOption = document.createElement("option")
                            newOption.value = responseData.details['vat_code_id']
                            newOption.text = responseData.details['vat_code_text']
                            selectElement.appendChild(newOption)
                            
                            $("#update-product-vat-code-value").selectpicker('refresh')   
                        }
                    },
                    error: function(responseData, error){
                        swal({
                            title: "Error",
                            text: "An error ocured! " + error,
                            type: "error"
                        });
                    },
                    complete: function(){
                    }
                });
            }
        })
    })


    /*BUTTON FUNCTIONS*/


    function updateProduct(){
        var title = document.getElementById('update-product-title-value').value
        var details = document.getElementById('update-product-details-value').value
        var product_code = document.getElementById('update-product-product-code-value').value
        var status = document.getElementById('update-product-status-value').value
        var product_id = sessionStorage.getItem('product_id_for_update')

        var errors = ""
        if (title == ""){
            errors = "Title can not be blank"
        }

        if (errors == ""){
            $.ajax({
                url: "{% url 'update_product' %}", 
                data:{
                    product_id: product_id,
                    title: title,
                    details: details,
                    product_code: product_code,
                    status: status
                }, 
                success:function(responseData) {
                    if(responseData.custome_status == "Error"){ 
                        swal({
                            title: "Error",
                            text: responseData.message,
                            type: "error"
                        });
                    }else{
                        swal({
                            title: "Success",
                            text: responseData.message,
                            type: "success"
                        }); 
                    }
                },
                error: function(responseData, error){
                    swal({
                        title: "Error",
                        text: "An error ocured! " + error,
                        type: "error"
                    });
                },
                complete: function(){
                    productsInitialLoad()
                }
            });
        }else{
            swal({
                title: "Error",
                text: errors,
                type: "error"
            });
        }


    }



function deleteProduct(product_id){
    $.ajax({
        url: "{% url 'delete_product' %}",
        data: {
            product_id: product_id
        },
        success: function(responseData) {
            swal({
                title: responseData.title,
                text: responseData.message,
                type: responseData.type
            })
        },
        error: function(responseData, error){
            swal({
                title: "Error",
                text: "An error occured! " + error,
                type: "error"
            });
        },
        complete: function(){
            productsInitialLoad()
        }
    });
}

    function openVatCodesPopup(){
        newBrowserWindow("{% url 'VATcodes_page' %}")
    }

    
    function addProduct(){
        var title = document.getElementById('add-product-title').value 
        var product_code = document.getElementById('add-product-product-code').value 
        var details = document.getElementById('add-product-details').value 
        var vat_code = document.getElementById('add-product-vat-code').value 
        var status = document.getElementById('add-product-status').value 


        var errors = ""

        if (title == ""){
            errors = "Title field can not be blank"
        }else if (product_code == ""){
            product_code = ""
        }else if (details == ""){
            errors = "Details field can not be blank"
        }else if (vat_code == ""){
            errors = "Vat_code field can not be blank"
        }else if (status == ""){
            errors = "Status field can not be blank"
        }

        if (errors == ""){
            $.ajax({
                url: "{% url 'add_product' %}",
                data: {
                    title: title,
                    product_code: product_code,
                    details: details,
                    vat_code: vat_code,
                    status: status
                },
                success: function(responseData) {
                    if(responseData.custome_status == "Error"){
                        //alert(responseData.message)
                        swal({
                            title: "Error",
                            text: responseData.message,
                            type: "error"
                        });
                    }else{
                        //alert(responseData.message)
                        swal({
                            title: "Success",
                            text: responseData.message,
                            type: "success"
                        });
                    }
                },
                error: function(responseData, error){
                    //alert("An error ocured! " + error)
                    swal({
                        title: "Error",
                        text: "An error ocured! " + error,
                        type: "error"
                    });
                }
            });
        }else{
            //alert("Error!" + errors)
            swal({
                title: "Error",
                text: errors,
                type: "error"
            });
        }
    }


    /*LIVE FUNCTIONS*/

    $(document).on('keyup', '.update_product_vat_code_selector_class .bs-searchbox input', function(e){
        if (e.key.length === 1 || e.key === "Backspace") { 
            var searchQuery = $(this).val();
            $.ajax({
                url: "{% url 'load_live_vat_code_options' %}",
                data: { search_query: searchQuery },
                success: function(responseData) {
                    var selectElement = document.getElementById('update-product-vat-code-value')
                    $("#update-product-vat-code-value").empty();
                    responseData.options.forEach(optionString => {

                        var newOption = document.createElement("option")
                        var parsedOption = $(optionString)[0]
                        newOption.value = parsedOption.value
                        newOption.text = parsedOption.textContent
                        selectElement.appendChild(newOption)
                    })
                    $("#update-product-vat-code-value").selectpicker('refresh')   
                },
                error: function(responseData, error){
                        //alert("An error ocured! " + error)
                }
            });
        }
    })


    $(document).on('keyup', '.add_product_vat_code_selector_class .bs-searchbox input', function(e){
        if (e.key.length === 1 || e.key === "Backspace") { 
            var searchQuery = $(this).val();
            $.ajax({
                url: "{% url 'load_live_vat_code_options' %}",
                data: { search_query: searchQuery },
                success: function(responseData) {
                    var selectElement = document.getElementById('add-product-vat-code')
                    $("#add-product-vat-code").empty();
                    responseData.options.forEach(optionString => {

                        var newOption = document.createElement("option")
                        var parsedOption = $(optionString)[0]
                        newOption.value = parsedOption.value
                        newOption.text = parsedOption.textContent
                        selectElement.appendChild(newOption)
                    })
                    $("#add-product-vat-code").selectpicker('refresh')   
                },
                error: function(responseData, error){
                        //alert("An error ocured! " + error)
                }
            });
        }
    })
    /*LIVE FUNCTIONS*/

    /*TRIGERED FUNCTIONS*/

    function preloadVatCodeElement(){
        var searchQuery = 'Zero'
        $.ajax({
            url: "{% url 'load_live_vat_code_options' %}",
            data: { search_query: searchQuery },
            success: function(responseData) {
                var selectElement = document.getElementById('add-product-vat-code')
                $("#add-product-vat-code").empty();
                responseData.options.forEach(optionString => {

                    var newOption = document.createElement("option")
                    var parsedOption = $(optionString)[0]
                    newOption.value = parsedOption.value
                    newOption.text = parsedOption.textContent
                    selectElement.appendChild(newOption)
                })
                $("#add-product-vat-code").selectpicker('refresh')   
            },
            error: function(responseData, error){
                    //alert("An error ocured! " + error)
            }
        });
    }


    /*TRIGERED FUNCTIONS*/


</script>
