{% load static %}


<!-- GLOBAL SEARCH -->

<div class="modal fade animated bounce" id="searchModal" role="dialog">
    <div class="modal-dialog modal-medium">
        <div class="modal-content" style="padding: 2rem;">
            <div class="modal-header">
                <span><b><i class="notika-icon notika-search"></i> Searh Pade </b></span>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div class="realtime-ctn">
                            <div class="realtime-title">
                                
                            </div>
                        </div>
                        <div class="card-box">
                            <div class="todoapp">
                                <div id="todo-form">
                                    <div class="row">
                                        <div class="col-sm-12 col-md-12 col-sm-12 col-xs-12 todo-inputbar">
                                            <div class="form-group todo-flex">
                                                <div class="nk-int-st">
                                                    <select data-live-search="true" style="background: red; width: 100%;" class="selectpicker global_search_link_selector" id="global-search-link-value">
                                                        <option value="0">Type here to search</option>
                                                    </select>
                                                </div>
                                                <div class="todo-send">
                                                    <button class="btn-primary btn-md btn-block btn" type="button"  onclick="openCurrentSearchLink()">Open</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- // GLOBAL SEARCH -->


<!-- NOTES -->

<div class="modal fade animated bounce" id="notePadeModal" role="dialog">
    <div class="modal-dialog modal-large">
        <div class="modal-content" style="padding: 2rem;">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div class="realtime-ctn">
                            <div class="realtime-title">
                                <h2><i class="notika-icon notika-edit"></i> NotePade </h2>
                            </div>
                        </div>
                        <div class="card-box">
                            <div class="todoapp">
                                <div class="notika-todo-scrollbar">
                                    <div style="width:100%; height: 40vh; background: whitesmoke; border-radius: 0.5%; overflow-y: scroll; overflow-wrap: break-word; ">
                                        <table class="table table-hover" id="notes-table">
                                        </table>
                                    </div>
                                </div>
                                <div id="todo-form">
                                    <div class="row">
                                        <div class="col-sm-12 col-md-12 col-sm-12 col-xs-12 todo-inputbar">
                                            <div class="form-group todo-flex">
                                                <div class="nk-int-st">
                                                    <input type="text" id="note-input-text" class="form-control" placeholder="Add new notes">
                                                </div>
                                                <div class="todo-send">
                                                    <button class="btn-primary btn-md btn-block btn notika-add-todo" type="button"  onclick="addNote()">Add</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- // NOTES -->







<!-- JS -->
<script src="{% static '' %}jquery.min.js"></script>
<script>
    $(document).ready(function() {
        $('#notePadeModal').on('show.bs.modal', function (event) {
            loadNotePade()
        })

        $('#searchModal').on('show.bs.modal', function (event) {
            //loadNotePade()
        })
         
    })


    function openCurrentSearchLink(){

    }

    function loadNotePade(){
        $.ajax({
            url: "{% url 'ajax_notes_live_search' %}",
            data: {
            },
            success: function(responseData) {
                if(responseData.custome_status == "Error"){
                    //alert(responseData.message)
                    swal({
                        title: "Error",
                        text: responseData.message,
                        type: "error"
                    });
                }else{
                    document.getElementById('note-input-text').value = ""
                    document.getElementById('notes-table').innerHTML = responseData.notes_list
                    var element = document.getElementById('notes-table')
                    element.scrollTo(0, element.scrollHeight);

                }
            },
            error: function(responseData, error){
                //alert("An error ocured! " + error)
                swal({
                    title: "Error",
                    text: "An error ocured! while trying to load notes",
                    type: "error"
                });
            }
        });
    }
    /**/

    /*BUTTON FUNCTIONS*/


    function addNote(){
        var note_text = document.getElementById('note-input-text').value

        var errors = ""
        if (note_text.replaceAll(' ','') == ""){
            errors = "Add some text before you add!"
        }

        if (errors == ""){
            $.ajax({
                url: "{% url 'add_note' %}",
                data: {
                    note_text: note_text,
                },
                success: function(responseData) {
                    if(responseData.custome_status == "Error"){
                        swal({
                            title: "Error",
                            text: responseData.message,
                            type: "error"
                        });
                    }else{
                        /*swal({
                            title: "Success",
                            text: responseData.message,
                            type: "success"
                        });*/
                    }
                },
                error: function(responseData, error){
                    swal({
                        title: "Error",
                        text: "An error ocured! " + error,
                        type: "error"
                    });
                },
                complete: function(){
                    loadNotePade()
                }
            });
        }else{
            swal({
                title: "Error",
                text: errors,
                type: "error"
            });
        }
    }


    function deleteNote(note_id){
        $.ajax({
            url: "{% url 'delete_note' %}",
            data: {
                note_id: note_id
            },
            success: function(responseData) {
                if(responseData.custome_status == "Error"){
                    //alert(responseData.message)
                    swal({
                        title: "Error",
                        text: responseData.message,
                        type: "error"
                    });
                }else{
                    //alert(responseData.message)
                    swal({
                        title: "Success",
                        text: responseData.message,
                        type: "success"
                    });
                }
            },
            error: function(responseData, error){
                //alert("An error ocured! " + error)
                swal({
                    title: "Error",
                    text: "An error ocured! " + error,
                    type: "error"
                });
            },
            complete: function(){
                loadNotePade()
            }
        })
    }



    /* // BUTTON FUNCTIONS*/


    /*LIVE FUNCTIONS*/
    $(document).on('keyup', '.global_search_link_selector .bs-searchbox input', function(e){
        if (e.key.length === 1 || e.key === "Backspace") { 
            var searchQuery = $(this).val();
                $.ajax({
                    url: "{% url 'load_global_search_options' %}",
                    data: { search_query: searchQuery },
                    success: function(responseData) {
                        var selectElement = document.getElementById('global-search-link-value')
                        $("#global-search-link-value").empty();
                        responseData.options.forEach(optionString => {

                            var newOption = document.createElement("option")
                            var parsedOption = $(optionString)[0]
                            newOption.value = parsedOption.value
                            newOption.text = parsedOption.textContent
                            selectElement.appendChild(newOption)
                        })
                        $("#global-search-link-value").selectpicker('refresh')   
                    },
                    error: function(responseData, error){
                        //alert("An error ocured! " + error)
                    }
                });
            }
        })

    /*LIVE FUNCTIONS*/


</script>
