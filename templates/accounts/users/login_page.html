<script>
    function togglePasswordVisibility() {
        var passwordInput = document.getElementById('login-password-value');
        var icon = document.getElementById('togglePasswordIcon');
        
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.classList.remove('notika-icon notika-eye');
            icon.classList.add('notika-icon notika-eye-slash');
        } else {
            passwordInput.type = "password";
            icon.classList.remove('notika-icon notika-eye-slash');
            icon.classList.add('notika-icon notika-eye');
        }
    }
    function login(){
        var username = document.getElementById('login-username-value').value
        var password = document.getElementById('login-password-value').value
        
        var errors = ""

        if(username == ""){
            errors = "Username field can not be blank"
        }else if(password == ""){
            errors = "Password field can not be blank"
        }

        if (errors == ""){
            $.ajax({
                type: 'POST',
                url: "{% url 'login' %}",
                data: {
                    username: username,
                    password: password,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                success: function(responseData) {
                    if(responseData.custome_status == "Error"){
                        //alert(responseData.message)
                        swal({
                            title: "Error",
                            text: responseData.message,
                            type: "error"
                        });
                    }else{
                        window.location.href = '{% url "home" %}'
                    }
                },
                error: function(responseData, error){
                    //alert("An error ocured! " + error)
                    swal({
                        title: "Error",
                        text: "An error ocured! " + error,
                        type: "error"
                    });
                }
            });

        }else{
            //alert(errors)
            swal({
                title: "Error",
                text: errors,
                type: "error"
            });
        }
        
    }

</script>
