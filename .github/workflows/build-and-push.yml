name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*.*.*'
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify Docker Hub Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo "::error::Missing Docker Hub credentials in GitHub Secrets!"
            echo "Please go to Settings > Secrets and variables > Actions in your GitHub repository and add:"
            echo "  - DOCKER_USERNAME (e.g. tinashemp)"
            echo "  - DOCKER_TOKEN (Personal Access Token from https://hub.docker.com/settings/security)"
            exit 1
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME || 'tinashemp' }}/clarity-pos:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME || 'tinashemp' }}/clarity-pos:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME || 'tinashemp' }}/clarity-pos:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deployment Summary
        run: |
          echo "===================================================="
          echo "Docker Image successfully built and pushed!"
          echo "Repository: ${{ secrets.DOCKER_USERNAME || 'tinashemp' }}/clarity-pos"
          echo "Tags:"
          echo "  - latest"
          echo "  - ${{ github.sha }}"
          echo "  - ${{ github.ref_name }}"
          echo "===================================================="