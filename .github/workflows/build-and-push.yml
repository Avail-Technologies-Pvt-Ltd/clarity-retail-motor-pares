name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*.*.*'
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Resolve Docker Hub Credentials
        id: docker_creds
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo "::error title=Missing Docker Hub Credentials::Docker Hub username or token is missing in GitHub Repository Secrets!"
            echo "================================================================="
            echo "ACTION REQUIRED: Please configure Docker Hub Secrets in GitHub:"
            echo "1. Open your repository Settings: ${{ github.server_url }}/${{ github.repository }}/settings/secrets/actions"
            echo "2. Add 'DOCKER_USERNAME' (e.g. tinashemp)"
            echo "3. Add 'DOCKER_TOKEN' (Docker Hub Personal Access Token or Password)"
            echo "================================================================="
            exit 1
          fi
          echo "username=$DOCKER_USERNAME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.docker_creds.outputs.username }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker_creds.outputs.username }}/clarity-pos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Output Deployment Summary
        run: |
          IMAGE_NAME="${{ steps.docker_creds.outputs.username }}/clarity-pos"
          echo "### 🚀 Docker Image Successfully Built and Pushed!" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Repository:** \`${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${IMAGE_NAME}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${IMAGE_NAME}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View on Docker Hub](https://hub.docker.com/r/${IMAGE_NAME})" >> $GITHUB_STEP_SUMMARY
          echo "===================================================="
          echo "Image successfully published to Docker Hub: ${IMAGE_NAME}"
          echo "===================================================="