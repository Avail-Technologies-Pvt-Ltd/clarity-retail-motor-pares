version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    image: pos-app-test:latest
    container_name: pos-app-test-web
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=point_of_sale.settings_prod
      - SECRET_KEY=test-secret-key-12345
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DB_NAME=test_pos
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_HOST=test_db
      - DB_PORT=5432
      - FISCAL_TEST_MODE=True
      - FISCAL_DEVICE_ID=10626
      - FISCAL_SERIAL_NO=9029D38C011B
      - FISCAL_ACTIVATION_KEY=00398834
    depends_on:
      - test_db
    restart: unless-stopped

  test_db:
    image: postgres:13
    container_name: pos-app-test-db
    environment:
      - POSTGRES_DB=test_pos
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    ports:
      - "5433:5432"  # Different port to avoid conflict
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  test_postgres_data: