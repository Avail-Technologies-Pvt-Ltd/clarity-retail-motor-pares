services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.light
    container_name: pos-app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=point_of_sale.settings_dev
      - DEBUG=True
      - SECRET_KEY=test-secret-key-12345
      - SENTRY_DSN=
    volumes:
      - ../db.sqlite3:/app/db.sqlite3
    restart: unless-stopped
