<!-- fiscalisation/templates/fiscalisation/receipt_detail.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Receipt #{{ receipt.receipt_global_no }}</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
        }
        .receipt {
            max-width: 300px;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 20px;
        }
        .header {
            text-align: center;
            border-bottom: 1px dashed #ccc;
            margin-bottom: 10px;
        }
        .line-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        .total {
            border-top: 1px solid #ccc;
            margin-top: 10px;
            padding-top: 10px;
            font-weight: bold;
        }
        .qr {
            text-align: center;
            margin: 20px 0;
        }
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="receipt">
        <div class="header">
            <h3>TAX INVOICE</h3>
            <p>Global #: {{ receipt.receipt_global_no }}</p>
            <p>Invoice #: {{ receipt.invoice_no }}</p>
            <p>Date: {{ receipt.created_at|date:"Y-m-d H:i:s" }}</p>
        </div>
        
        <div class="qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ receipt.qr_code_url }}" 
                 alt="QR Code">
        </div>
        
        <div class="total">
            <div class="line-item">
                <span>TOTAL:</span>
                <span>${{ receipt.total_amount }}</span>
            </div>
        </div>
        
        <div class="footer" style="text-align: center; margin-top: 20px; font-size: 12px;">
            <p>Thank you for your business!</p>
            <p>Verify at: {{ receipt.qr_code_url|truncatechars:50 }}</p>
        </div>
    </div>
    
    <div style="text-align: center; margin-top: 20px;" class="no-print">
        <button onclick="window.print()">Print Receipt</button>
        <button onclick="window.close()">Close</button>
    </div>
</body>
</html>
